services:
  db:
    image: postgres:17
    container_name: rutas_postgres
    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: rutas_django

    env_file:
      - .env

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - db

  adminer:
    image: adminer
    container_name: rutas_adminer
    restart: always

    ports:
      - "8080:8080"

    depends_on:
      - db

volumes:
  postgres_data: