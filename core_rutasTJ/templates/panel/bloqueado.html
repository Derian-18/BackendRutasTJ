<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Bloqueado</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 14px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        .icon {
            font-size: 64px;
            color: #1976d2;
            margin-bottom: 15px;
        }

        h1 {
            color: #0d47a1;
            margin-bottom: 10px;
            font-size: 26px;
        }

        p {
            color: #555;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .info {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #1976d2;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background: #0d47a1;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🔒</div>

        <h1>Acceso bloqueado</h1>

        <p>
            Tu cuenta o dirección IP ha sido bloqueada temporalmente
            por múltiples intentos fallidos de inicio de sesión.
        </p>

        <div class="info">
            Por favor, intenta nuevamente después de un tiempo.
            Esta medida es por tu seguridad.
        </div>

        <a href="{% url 'home' %}" class="btn">
            Volver al inicio
        </a>

        <footer>
            © Sistema de Administración
        </footer>
    </div>

</body>
</html>
