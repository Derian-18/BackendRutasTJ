{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Rutas TJ</title>
    <link rel="stylesheet" href="{% static 'panel/css/login.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header>
        <a href="{% url 'home' %}" class="logo">
            <div class="logo-icon">
                <i class="fas fa-bus"></i>
            </div>
            Rutas TJ
        </a>
        <nav>
            <a href="{% url 'home' %}"><i class="fas fa-home"></i> Inicio</a>
            <a href="{% url 'mapa' %}"><i class="fas fa-map-marked-alt"></i> Mapa</a>
            <a href="{% url 'contacto' %}"><i class="fas fa-envelope"></i>Contacto</a>
            <a href="#" class="btn-admin"><strong>Iniciar sesión</strong></a>
        </nav>
    </header>

    <main>
        <h2>Iniciar sesión</h2>
        {% if messages %}
            {% for message in messages %}
                <p class="error-msg">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label for="user">Usuario:</label>
            <input type="text" id="user" name="username" placeholder="Tu usuario">

            <label for="pass">Contraseña:</label>
            <input type="password" id="pass" name="password" placeholder="********">

            <button type="submit">Entrar</button>
        </form>
    </main>

    <footer>
        &copy; {% now "Y" %} Rutas TJ - Todos los derechos reservados.
    </footer>
</body>
</html>
